apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: user-service
  namespace: app-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: user-service
  template:
    metadata:
      labels:
        app: user-service
    spec:
      containers:
      - name: user-service
        image: localhost/user-service:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: APP_VERSION
          value: v1
        ports:
        - name: grpc
          containerPort: 50051
  strategy:
    canary:
      stableService: user-service-stable
      canaryService: user-service-canary
      # Gateway API traffic-router plugin updates GetUser weights on the GRPCRoute.
      # CreateUser stays 100% stable because that rule only references user-service-stable
      # (the plugin only mutates rules that contain BOTH stable and canary BackendRefs).
      trafficRouting:
        plugins:
          argoproj-labs/gatewayAPI:
            grpcRoute: userservice-route
            namespace: app-demo
      steps:
      # setWeight N => GetUser canary=N / stable=(100-N); CreateUser unchanged
      - setWeight: 10
      - pause:
          duration: 5s
      - analysis:
          templates:
          - templateName: grpc-load-generator
          args:
          - name: distribution
            value: "GetUser=v1:90,v2:10;CreateUser=v1:100"

      - setWeight: 25
      - pause:
          duration: 5s
      - analysis:
          templates:
          - templateName: grpc-load-generator
          args:
          - name: distribution
            value: "GetUser=v1:75,v2:25;CreateUser=v1:100"

      - setWeight: 50
      - pause:
          duration: 5s
      - analysis:
          templates:
          - templateName: grpc-load-generator
          args:
          - name: distribution
            value: "GetUser=v1:50,v2:50;CreateUser=v1:100"

      - analysis:
          templates:
          - templateName: user-service-success-rate
          args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest

      # Manual gate before promotion
      - pause: {}
