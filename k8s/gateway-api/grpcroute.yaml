apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: userservice-route
  namespace: app-demo
spec:
  parentRefs:
  - group: ""
    kind: Service
    name: user-service
    port: 50051
  rules:
  # GetUser: both backends present so the Argo Gateway API plugin can setWeight here.
  # Initial canary weight is 0; Rollout setWeight drives canary / (100-canary).
  - matches:
    - method:
        service: usercard.UserService
        method: GetUser
    backendRefs:
    - name: user-service-stable
      port: 50051
      weight: 100
    - name: user-service-canary
      port: 50051
      weight: 0
  # CreateUser: stable only — the plugin leaves this rule untouched.
  - matches:
    - method:
        service: usercard.UserService
        method: CreateUser
    backendRefs:
    - name: user-service-stable
      port: 50051
      weight: 100
  # DEFAULT: stable only
  - backendRefs:
    - name: user-service-stable
      port: 50051
      weight: 100
