---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-api
  namespace: app-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: user-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: user-api
    spec:
      containers:
        - name: user-api
          image: localhost/user-api
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_SERVICE_HOST
              value: user-service:50051
            - name: DEFAULT_USER_NAME
              value: demo-user
            - name: DEFAULT_THEME
              value: blue
            - name: LOG_LEVEL
              value: DEBUG
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: localhost/frontend:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_API_URL
              value: http://user-api:8080            
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: http
          livenessProbe:
            httpGet:
              path: /health
              port: http
