apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app-demo
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: user-api
  labels:
    app.kubernetes.io/name: user-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: user-api
  ports:
    - name: http
      port: 8080
      targetPort: http
